<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAPID</title>
<style>
  :root { --bg:#fff; --fg:#1b1b1f; --mut:#6b6b76; --line:#e4e4ea; --acc:#2f5fd0; --card:#f7f7fa; --bad:#c62828; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16161a; --fg:#e8e8ee; --mut:#9a9aa6; --line:#2c2c34; --acc:#7aa2ff; --card:#1e1e24; --bad:#ff6b6b; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 system-ui,Segoe UI,sans-serif; }
  header { display:flex; align-items:center; gap:24px; padding:12px 24px; border-bottom:1px solid var(--line); }
  header b { font-size:16px; letter-spacing:.5px; }
  nav button { background:none; border:0; color:var(--mut); font:inherit; padding:6px 10px; cursor:pointer; border-bottom:2px solid transparent; }
  nav button.on { color:var(--fg); border-color:var(--acc); }
  main { display:grid; grid-template-columns: 340px 1fr; gap:24px; padding:24px; max-width:1300px; margin:0 auto; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  #form { position:sticky; top:12px; align-self:start; max-height:calc(100vh - 24px); overflow:auto; padding-right:8px; }
  @media (max-width: 900px) { #form { position:static; max-height:none; } }
  h3 { margin:18px 0 6px; font-size:12px; text-transform:uppercase; letter-spacing:.8px; color:var(--mut); }
  h3:first-child { margin-top:0; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:3px 0; }
  .row label { color:var(--mut); font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  input[type=text], input[type=number], select { width:130px; padding:4px 6px; background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:4px; font:inherit; }
  input[type=checkbox] { accent-color: var(--acc); }
  .bar { display:flex; gap:8px; margin:0 0 16px; align-items:center; flex-wrap:wrap; }
  button.b { padding:7px 16px; border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:4px; font:inherit; cursor:pointer; }
  button.b.go { background:var(--acc); border-color:var(--acc); color:#fff; }
  button.b.stop { color:var(--bad); }
  button.b:disabled { opacity:.45; cursor:default; }
  #status { color:var(--mut); margin-left:auto; }
  pre { background:var(--card); border:1px solid var(--line); border-radius:4px; padding:10px; height:130px; overflow:auto; margin:0 0 16px; font:12px/1.4 ui-monospace,Consolas,monospace; white-space:pre-wrap; }
  table { border-collapse:collapse; width:100%; font-size:13px; margin:8px 0 16px; }
  th, td { text-align:right; padding:4px 8px; border-bottom:1px solid var(--line); }
  th { color:var(--mut); font-weight:500; position:sticky; top:0; background:var(--bg); }
  .tw { max-height:300px; overflow:auto; }
  #prog { min-height:22px; display:flex; align-items:center; gap:10px; }
  progress { width:280px; height:10px; accent-color:var(--acc); }
  .pulse { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--acc); animation:pulse 1s infinite alternate; }
  @keyframes pulse { from { opacity:.25; } to { opacity:1; } }
  img { max-width:100%; border:1px solid var(--line); border-radius:4px; margin:0 0 12px; }
  /* matplotlib PNGs are white: invert them in dark mode (hue-rotate keeps the colours recognisable) */
  @media (prefers-color-scheme: dark) { img { filter: invert(.9) hue-rotate(180deg); } }
  details { margin-top:8px; }
  .hint { color:var(--mut); font-size:13px; margin:0 0 8px; max-width:720px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:10px; margin:12px 0 16px; }
  .card { border:1px solid var(--line); border-radius:6px; padding:6px 8px; background:var(--card); }
  .card.hl { border-color:var(--acc); box-shadow:0 0 0 1px var(--acc); }
  .card b { font-size:12px; }
  .card small { display:block; color:var(--mut); font-size:11px; line-height:1.35; }
  .card svg { width:100%; height:74px; display:block; margin:2px 0; }
  .card .plan { fill:var(--acc); fill-opacity:.35; stroke:var(--acc); stroke-width:1; vector-effect:non-scaling-stroke; }
  .card .plan.chosen { fill:#e0a800; fill-opacity:.45; stroke:#e0a800; }
  .card .plan.chart { fill:var(--bad); fill-opacity:.3; stroke:var(--bad); }
  .pareto text { fill:var(--mut); font-size:11px; }
  .pareto .num { fill:var(--fg); font-size:10px; }
  .pareto .ax { stroke:var(--line); }
  .pareto circle { cursor:pointer; }
  summary { cursor:pointer; color:var(--mut); font-size:12px; text-transform:uppercase; letter-spacing:.8px; }
</style>
</head>
<body>
<header>
  <b>RAPID</b>
  <nav id="nav"></nav>
</header>
<main>
  <section id="form"></section>
  <section>
    <div class="bar" id="bar"></div>
    <div id="prog" class="hint"></div>
    <pre id="log"></pre>
    <div id="res"></div>
  </section>
</main>
<script>
const TOKEN = "__TOKEN__";
const MODES = [["transonic","Transonic"],["conventional","Conventional"],["bwb","BWB"],["airfoil","Airfoil"],["check","Check"]];
const OPTS = {
  transonic:    [["pop","Population",40],["gens","Generations",30],["cores","Cores (blank = all)",""],["seed","Seed",1],
                 ["select","Pick from front",["range","drag","weight","weighted"]],["fresh","Fresh start",false],["no_tc","Fix t/c",false],
                 ["airfoil","Airfoil co-opt after",false],["catalog","Airfoil catalog",["UIUC_All","Medium_Re","High_Re","Low_Re","Reflexed","Transonic"]]],
  conventional: [["pop","Population",32],["gens","Generations",20],["cores","Cores (blank = all)",""],["fresh","Fresh start",false],["airfoil","Airfoil co-opt after",false]],
  bwb:          [["pop","Population",32],["gens","Generations",20],["cores","Cores (blank = all)",""],["fresh","Fresh start",false],["airfoil","Airfoil co-opt after",false]],
  airfoil:      [["vsp3",".vsp3 wing","system_files/presets/example_transport_wing.vsp3"],["n_sections","Stations",5],
                 ["catalog","Catalog",["Low_Re","Medium_Re","High_Re","UIUC_All","Reflexed","Transonic"]],["cores","Cores (blank = all)",""],["refine","Refine shape",false]],
  check:        [],
};
let mode = "transonic", cfg = {}, opts = {}, offset = 0, polling = null, prog = null;
const $ = id => document.getElementById(id);

function deepMerge(a, b) {
  if (!b || typeof b !== "object" || Array.isArray(b)) return b === undefined ? a : b;
  const o = Object.assign({}, a);
  for (const k of Object.keys(b)) o[k] = (a && typeof a[k] === "object" && !Array.isArray(a[k])) ? deepMerge(a[k], b[k]) : b[k];
  return o;
}
function draft() { try { localStorage.setItem("rapid_draft_" + mode, JSON.stringify({cfg, opts})); } catch (e) {} }

function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k === "onclick" || k === "onchange" ? e[k] = v : e.setAttribute(k, v);
  kids.forEach(c => e.append(c));
  return e;
}

function field(label, value, set) {
  let inp;
  if (typeof value === "boolean") { inp = el("input", {type:"checkbox"}); inp.checked = value; inp.onchange = () => set(inp.checked); }
  else if (typeof value === "number") { inp = el("input", {type:"number", step:"any", value}); inp.onchange = () => set(parseFloat(inp.value)); }
  else if (Array.isArray(value)) { inp = el("input", {type:"text", value:JSON.stringify(value)}); inp.onchange = () => { try { set(JSON.parse(inp.value)); inp.style.color=""; } catch(e) { inp.style.color="red"; } }; }
  else { inp = el("input", {type:"text", value: value ?? ""}); inp.onchange = () => set(inp.value === "" && value === null ? null : inp.value); }
  return el("div", {class:"row"}, el("label", {title:label}, label), inp);
}

function renderConfig(obj, host, path = []) {
  for (const [k, v] of Object.entries(obj)) {
    if (v && typeof v === "object" && !Array.isArray(v)) {
      const d = el("details", path.length ? {} : {open: ""}, el("summary", {}, [...path, k].join(" / ")));
      renderConfig(v, d, [...path, k]); host.append(d);
    } else host.append(field(k, v, nv => { obj[k] = nv; draft(); }));
  }
}

function render() {
  const nav = $("nav"); nav.innerHTML = "";
  MODES.forEach(([m, name]) => nav.append(el("button", {class: m === mode ? "on" : "", onclick: () => setMode(m)}, name)));
  const f = $("form"); f.innerHTML = "";
  f.append(el("h3", {}, "Run"));
  for (const [k, label, def] of OPTS[mode]) {
    if (Array.isArray(def)) {
      const s = el("select", {onchange: () => { opts[k] = s.value; draft(); }}); def.forEach(o => s.append(el("option", {value: Array.isArray(o) ? o[0] : o}, Array.isArray(o) ? o[1] : o))); s.value = opts[k];
      f.append(el("div", {class:"row"}, el("label", {}, label), s));
    } else f.append(field(label, opts[k], nv => { opts[k] = nv; draft(); }));
  }
  if (Object.keys(cfg).length) { f.append(el("h3", {}, "Parameters")); renderConfig(cfg, f); }
  const bar = $("bar"); bar.innerHTML = "";
  const go = el("button", {class:"b go", id:"go", onclick: () => run("run")}, mode === "check" ? "Run check" : "Run");
  bar.append(go);
  if (mode === "transonic") bar.append(el("button", {class:"b", id:"rep", onclick: () => run("report")}, "Rebuild report"));
  if (mode === "conventional" || mode === "bwb") bar.append(el("button", {class:"b", id:"plot", onclick: () => run("plot")}, "Make plot"));
  bar.append(el("button", {class:"b stop", id:"stop", onclick: stop}, "Stop"),
             el("button", {class:"b", id:"reset", onclick: resetMode}, "Reset"),
             el("button", {class:"b", id:"save", onclick: saveSettings}, "Save settings"), el("span", {id:"status"}, ""));
}

async function setMode(m) {
  mode = m;
  const r = await (await fetch("/api/config?mode=" + m)).json();
  cfg = r.config;
  if (m === "airfoil") {                                   // the wings this GUI produced, as a dropdown
    const w = await (await fetch("/api/wings")).json();
    OPTS.airfoil[0] = ["vsp3", "Wing to work on", w];
  }
  opts = {}; for (const [k, , def] of OPTS[m]) opts[k] = Array.isArray(def) ? (Array.isArray(def[0]) ? def[0][0] : def[0]) : def;
  Object.assign(opts, r.options);
  try {                                                   // unsaved edits survive a page refresh
    const d = JSON.parse(localStorage.getItem("rapid_draft_" + m) || "null");
    if (d) { cfg = deepMerge(cfg, d.cfg); Object.assign(opts, d.opts); }
  } catch (e) {}
  render(); showResults();
}

async function post(url, body) {
  return (await fetch(url, {method:"POST", headers:{"X-Token":TOKEN, "Content-Type":"application/json"}, body:JSON.stringify(body)})).json();
}

async function run(action) {
  const r = await post("/api/run", {mode, action, options:opts, config:cfg});
  if (r.error) { alert(r.error); return; }
  offset = 0; $("log").textContent = ""; poll();
}
const stop = () => post("/api/stop", {});

async function saveSettings() {
  await post("/api/save", {mode, config: cfg, options: opts});
  const st = $("status"); st.textContent = "settings saved";
  setTimeout(() => { if (st.textContent === "settings saved") st.textContent = ""; }, 2500);
}

async function resetMode() {
  if (!confirm("Reset " + mode + "?\n\nThis deletes the saved results and checkpoint of this mode. Your parameter settings are kept.")) return;
  const r = await post("/api/reset", {mode});
  if (r.error) { alert(r.error); return; }
  $("log").textContent = ""; offset = 0;
  await setMode(mode);
}

function poll() {
  clearInterval(polling);
  polling = setInterval(async () => {
    const r = await (await fetch("/api/log?offset=" + offset)).json();
    offset = r.offset;
    const log = $("log"), atEnd = log.scrollTop + log.clientHeight >= log.scrollHeight - 20;
    if (r.text) { log.textContent += r.text; if (atEnd) log.scrollTop = log.scrollHeight; }
    const st = $("status"), go = $("go");
    for (const m of (r.text || "").matchAll(/\[progress\] (\d+)\/(\d+) ([^\r\n]*)/g)) prog = {done: +m[1], total: +m[2], label: m[3]};
    if (st) st.textContent = r.running ? `${r.label} · ${r.secs}s` : (r.code === null ? "idle" : r.code === 0 ? "finished" : "stopped / failed (exit " + r.code + ")");
    const pg = $("prog"); pg.innerHTML = "";
    if (r.running) {
      pg.append(el("span", {class: "pulse"}));
      if (prog) pg.append(el("progress", {max: prog.total, value: prog.done}), el("span", {}, `${prog.done}/${prog.total} ${prog.label}`));
      pg.append(el("span", {}, r.idle > 60 ? `no new output for ${r.idle}s: still computing (XFOIL runs can be slow)` : `last output ${r.idle}s ago`));
    } else prog = null;
    ["go","rep","plot","reset"].forEach(i => { if ($(i)) $(i).disabled = r.running; });
    if (!r.running) { clearInterval(polling); showResults(); }
  }, 1000);
}

const NS = "http://www.w3.org/2000/svg";
function sv(tag, attrs = {}, ...kids) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  kids.forEach(c => e.append(c));
  return e;
}
const niceTicks = (lo, hi, n = 5) => Array.from({length: n}, (_, i) => lo + (hi - lo) * i / (n - 1));

function planform(poly, cls, ext) {
  const mir = poly.slice().reverse().map(([y, x]) => [-y, x]);
  const d = poly.concat(mir).map(([y, x]) => y.toFixed(3) + "," + x.toFixed(3)).join(" ");
  const svg = sv("svg", {viewBox: `${-ext.y * 1.05} ${-ext.x * 0.05} ${ext.y * 2.1} ${ext.x * 1.1}`, preserveAspectRatio: "xMidYMid meet"});
  svg.append(sv("polygon", {points: d, class: "plan " + cls}));
  return svg;
}

function airfoilShape(coords, cls) {
  const svg = sv("svg", {viewBox: "-0.03 -0.15 1.06 0.30", preserveAspectRatio: "xMidYMid meet"});
  svg.append(sv("polygon", {points: coords.map(([x, y]) => x.toFixed(4) + "," + (-y).toFixed(4)).join(" "), class: "plan " + cls}));
  return svg;
}

function paretoView(P, host) {
  host.append(el("p", {class: "hint"}, P.hint));
  const W = 660, H = 340, m = {l: 64, r: 18, t: 12, b: 46}, pts = P.points;
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  const pad = (lo, hi) => { const d = (hi - lo || 1) * 0.08; return [lo - d, hi + d]; };
  const [x0, x1] = pad(Math.min(...xs), Math.max(...xs)), [y0, y1] = pad(Math.min(...ys), Math.max(...ys));
  const X = v => m.l + (v - x0) / (x1 - x0) * (W - m.l - m.r), Y = v => H - m.b - (v - y0) / (y1 - y0) * (H - m.t - m.b);
  const svg = sv("svg", {viewBox: `0 0 ${W} ${H}`, class: "pareto", style: "width:100%;max-width:720px;display:block"});
  niceTicks(x0, x1).forEach(v => svg.append(sv("line", {x1: X(v), x2: X(v), y1: m.t, y2: H - m.b, class: "ax"}),
    sv("text", {x: X(v), y: H - m.b + 15, "text-anchor": "middle"}, v.toFixed(Math.abs(x1 - x0) < 2 ? 2 : 0))));
  niceTicks(y0, y1).forEach(v => svg.append(sv("line", {x1: m.l, x2: W - m.r, y1: Y(v), y2: Y(v), class: "ax"}),
    sv("text", {x: m.l - 6, y: Y(v) + 3, "text-anchor": "end"}, v.toFixed(Math.abs(y1 - y0) < 20 ? 1 : 0))));
  svg.append(sv("text", {x: (m.l + W - m.r) / 2, y: H - 6, "text-anchor": "middle"}, P.xlabel));
  svg.append(sv("text", {transform: `translate(14 ${(m.t + H - m.b) / 2}) rotate(-90)`, "text-anchor": "middle"}, P.ylabel));
  const front = pts.filter(p => p.tag !== "chart" && !p.nocard).sort((a, b) => a.x - b.x);
  svg.append(sv("polyline", {points: front.map(p => X(p.x) + "," + Y(p.y)).join(" "), fill: "none", stroke: "var(--line)", "stroke-width": 1.5}));
  const ext = {x: 0, y: 0};
  if (P.shape !== "airfoil") pts.forEach(p => p.poly.forEach(([y, x]) => { ext.y = Math.max(ext.y, y); ext.x = Math.max(ext.x, x); }));
  const cards = el("div", {class: "cards"}), dots = [], cardEls = [];
  const hl = (i, on) => { dots[i].setAttribute("r", on ? 9 : (pts[i].tag ? 7 : 5)); cardEls[i].classList.toggle("hl", on); };
  const order = pts.map((p, i) => i).sort((a, b) => (pts[a].tag === "chart") - (pts[b].tag === "chart"));
  let n = 0;
  order.forEach(i => {
    const p = pts[i];
    if (p.nocard) { dots[i] = sv("circle", {cx: X(p.x), cy: Y(p.y), r: 3, fill: "var(--mut)", "fill-opacity": .4}); svg.append(dots[i]); return; }
    const label = p.tag === "chart" ? "chart" : String(++n);
    const col = p.tag === "chosen" ? "#e0a800" : p.tag === "chart" ? "var(--bad)" : "var(--acc)";
    const c = sv("circle", {cx: X(p.x), cy: Y(p.y), r: p.tag ? 7 : 5, fill: col, "fill-opacity": .85, stroke: "var(--bg)", "stroke-width": 1.5});
    c.onmouseenter = () => hl(i, true); c.onmouseleave = () => hl(i, false);
    dots[i] = c; svg.append(c);
    if (p.tag !== "chart") svg.append(sv("text", {x: X(p.x) + 8, y: Y(p.y) - 6, class: "num"}, label));
    const title = p.title ? (p.tag === "chosen" ? "★ " : "#" + label + " ") + p.title : p.tag === "chart" ? "Chart wing" : (p.tag === "chosen" ? "★ #" + label + " (chosen)" : "#" + label);
    const card = el("div", {class: "card"}, el("b", {}, title));
    card.append(P.shape === "airfoil" ? airfoilShape(p.poly, p.tag) : planform(p.poly, p.tag, ext));
    p.lines.forEach(l => card.append(el("small", {}, l)));
    card.onmouseenter = () => hl(i, true); card.onmouseleave = () => hl(i, false);
    cardEls[i] = card; cards.append(card);
  });
  host.append(svg, cards);
}

async function showResults() {
  const r = await (await fetch("/api/results?mode=" + mode)).json(), host = $("res"); host.innerHTML = "";
  if (r.pareto && r.pareto.points.length) paretoView(r.pareto, host);
  (r.paretos || []).forEach(P => { host.append(el("h3", {}, P.title)); paretoView(P, host); });
  const more = el("details", {}, el("summary", {}, "More plots and table"));
  r.images.forEach(u => { if (!(r.pareto && u.includes("pareto.png"))) more.append(el("img", {src: u + "&t=" + Date.now()})); });
  if (r.table && r.table.rows.length) {
    const t = el("table"), h = el("tr");
    r.table.columns.forEach(c => h.append(el("th", {}, c))); t.append(h);
    r.table.rows.forEach(row => { const tr = el("tr"); row.forEach(v => tr.append(el("td", {}, String(v)))); t.append(tr); });
    more.append(el("div", {class: "tw"}, t));
  }
  if (more.children.length > 1) host.append(more);
  if (!host.children.length) host.append(el("p", {class: "hint"}, "No results yet. Press Run."));
}

setMode("transonic"); poll();
</script>
</body>
</html>
