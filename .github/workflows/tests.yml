name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    # Solver-free tests (geometry, airfoil assignment, stability math, config).
    # OpenVSP/XFOIL runs need the binaries: use check_install.py --solve locally.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q system_files
      - run: python -m unittest discover -s tests -v
